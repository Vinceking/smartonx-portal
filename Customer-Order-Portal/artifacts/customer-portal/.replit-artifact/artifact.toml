kind = "web"
previewPath = "/"
title = "Smart On X Customer Portal"
description = "B2B customer ordering portal for Smart On X dental products. Includes a public homepage, customer portal with role-based ordering wizard (purchaser/regional_admin/org_admin), and a God-mode admin console for staff to manage orgs, onboard new accounts, track orders, and view integration logs."
version = "1.0.0"
id = "artifacts/customer-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23434

[services.development]
run = "pnpm --filter @workspace/customer-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/customer-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/customer-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23434"
BASE_PATH = "/"
