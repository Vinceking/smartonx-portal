components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── AUTH SCHEMAS ─────────────────────────────────────────────
    LoginCredentials:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail:
          type: string
        password:
          type: string

    AdminLoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthSession:
      type: object
      required: [userId, roleKey, username, hubspotCompanyId, hubspotContactId, mustChangePassword]
      properties:
        userId:
          type: number
        roleKey:
          type: string
        roleLabel:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        hubspotCompanyId:
          type: string
        hubspotContactId:
          type: string
        mustChangePassword:
          type: boolean

    AdminSession:
      type: object
      required: [adminId, name, email]
      properties:
        adminId:
          type: number
        name:
          type: string
        email:
          type: string

    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          

    UsernameOrEmailInput:
      type: object
      required: [usernameOrEmail]
      properties:
        usernameOrEmail:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
        confirmPassword:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
        confirmPassword:
          type: string

    TempPasswordResponse:
      type: object
      required: [tempPassword]
      properties:
        tempPassword:
          type: string

    # ─── PRODUCT SCHEMAS ──────────────────────────────────────────
    Product:
      type: object
      required: [id, sku, name, productLine, description, unitPriceCents, imageUrl, active]
      properties:
        id:
          type: number
        sku:
          type: string
        shopifyProductId:
          type: ["string", "null"]
        shopifyVariantId:
          type: ["string", "null"]
        name:
          type: string
        productLine:
          type: string
        description:
          type: string
        unitPriceCents:
          type: number
        imageUrl:
          type: string
        active:
          type: boolean

    # ─── HubSpot / CRM SCHEMAS ───────────────────────────────────
    HsCompany:
      type: object
      required: [id, name, orgType, allowAdminBillingEdit]
      properties:
        id:
          type: string
        name:
          type: string
        orgType:
          type: string
        allowAdminBillingEdit:
          type: boolean
        createdAt:
          type: string
          format: date-time

    HsBillingProfile:
      type: object
      required: [id, companyId, name, address1, city, state, zip, apEmail, paymentTerms, isDefault, validated]
      properties:
        id:
          type: string
        companyId:
          type: string
        name:
          type: string
        address1:
          type: string
        address2:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        apEmail:
          type: string
        apPhone:
          type: ["string", "null"]
        paymentTerms:
          type: string
        netDays:
          type: ["integer", "null"]
        isDefault:
          type: boolean
        validated:
          type: boolean
        placeId:
          type: ["string", "null"]
        usedByLocationCount:
          type: number

    HsLocation:
      type: object
      required: [id, companyId, billingProfileId, nickname, address1, city, state, zip, isDefault, validated]
      properties:
        id:
          type: string
        companyId:
          type: string
        billingProfileId:
          type: string
        nickname:
          type: string
        address1:
          type: string
        address2:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: ["string", "null"]
        isDefault:
          type: boolean
        validated:
          type: boolean
        placeId:
          type: ["string", "null"]
        validationSource:
          type: string
        billingProfile:
          $ref: "#/components/schemas/HsBillingProfile"

    HsContact:
      type: object
      required: [id, companyId, firstName, lastName, roleTitle, isActive]
      properties:
        id:
          type: string
        companyId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleTitle:
          type: string
        isActive:
          type: boolean
        emails:
          type: array
          items:
            $ref: "#/components/schemas/HsContactEmail"
        hasPortalAccount:
          type: boolean
        portalUsername:
          type: ["string", "null"]

    HsContactEmail:
      type: object
      required: [id, email, isPrimary]
      properties:
        id:
          type: number
        email:
          type: string
        isPrimary:
          type: boolean

    # ─── PLACES SCHEMAS ───────────────────────────────────────────
    PlacePrediction:
      type: object
      required: [placeId, description]
      properties:
        placeId:
          type: string
        description:
          type: string
        mainText:
          type: string
        secondaryText:
          type: string

    PlaceDetails:
      type: object
      required: [placeId, address1, city, state, zip]
      properties:
        placeId:
          type: string
        address1:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string

    # ─── ORDER SCHEMAS ────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, productId, skuSnapshot, nameSnapshot, quantity, unitPriceCents, lineTotalCents]
      properties:
        id:
          type: number
        productId:
          type: number
        skuSnapshot:
          type: string
        nameSnapshot:
          type: string
        quantity:
          type: number
        unitPriceCents:
          type: number
        lineTotalCents:
          type: number

    OrderSummary:
      type: object
      required: [id, orderNumber, hubspotCompanyId, hubspotLocationId, poNumber, status, paymentStatus, subtotalCents, shippingCents, totalCents, orderedAt]
      properties:
        id:
          type: number
        orderNumber:
          type: string
        hubspotCompanyId:
          type: string
        hubspotLocationId:
          type: string
        hubspotContactId:
          type: string
        portalUserId:
          type: number
        placedByRole:
          type: string
        poNumber:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        subtotalCents:
          type: number
        shippingCents:
          type: number
        totalCents:
          type: number
        orderedAt:
          type: string
          format: date-time
        shopifyOrderNumber:
          type: ["string", "null"]
        hubspotPoId:
          type: ["string", "null"]
        hubspotPoStatus:
          type: string
        locationNickname:
          type: ["string", "null"]
        orderedByUsername:
          type: ["string", "null"]
        orgName:
          type: ["string", "null"]
        itemCount:
          type: number

    OrderDetail:
      type: object
      required: [id, orderNumber, poNumber, status, paymentStatus, subtotalCents, shippingCents, totalCents, orderedAt, shipSnapshot, billingSnapshot, paymentTermsSnapshot, items]
      properties:
        id:
          type: number
        orderNumber:
          type: string
        hubspotCompanyId:
          type: string
        hubspotLocationId:
          type: string
        hubspotContactId:
          type: string
        portalUserId:
          type: number
        placedByRole:
          type: string
        poNumber:
          type: string
        orderNotes:
          type: ["string", "null"]
        status:
          type: string
        paymentStatus:
          type: string
        subtotalCents:
          type: number
        shippingCents:
          type: number
        totalCents:
          type: number
        orderedAt:
          type: string
          format: date-time
        shipSnapshot:
          type: object
          additionalProperties: true
        billingSnapshot:
          type: object
          additionalProperties: true
        paymentTermsSnapshot:
          type: string
        netDaysSnapshot:
          type: ["integer", "null"]
        shopifyOrderId:
          type: ["string", "null"]
        shopifyOrderNumber:
          type: ["string", "null"]
        hubspotPoId:
          type: ["string", "null"]
        hubspotPoStatus:
          type: string
        orderedByUsername:
          type: ["string", "null"]
        orgName:
          type: ["string", "null"]
        locationNickname:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderListResponse:
      type: object
      required: [orders, total, page, limit]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: number
        quantity:
          type: number
          minimum: 1

    OrderInput:
      type: object
      required: [hubspotLocationId, billingProfileId, poNumber, items]
      properties:
        hubspotLocationId:
          type: string
        billingProfileId:
          type: string
        poNumber:
          type: string
          maxLength: 40
        orderNotes:
          type: string
          maxLength: 500
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
          minItems: 1
        mockCardName:
          type: ["string", "null"]
        mockCardNumber:
          type: ["string", "null"]
        mockCardExpiry:
          type: ["string", "null"]
        mockCardCvc:
          type: ["string", "null"]

    OrderCreatedResponse:
      type: object
      required: [orderId, orderNumber]
      properties:
        orderId:
          type: number
        orderNumber:
          type: string

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── DASHBOARD SCHEMAS ───────────────────────────────────────
    DashboardData:
      type: object
      required: [ordersThisYear, lastOrderDate, defaultLocationNickname, recentOrders, quickReorderProducts]
      properties:
        ordersThisYear:
          type: number
        lastOrderDate:
          type: ["string", "null"]
        defaultLocationNickname:
          type: ["string", "null"]
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        quickReorderProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    AdminDashboardData:
      type: object
      required: [totalOrgs, totalPortalUsers, ordersThisMonth, revenueThisMonthCents, pendingLocationRequests, recentOrders]
      properties:
        totalOrgs:
          type: number
        totalPortalUsers:
          type: number
        ordersThisMonth:
          type: number
        revenueThisMonthCents:
          type: number
