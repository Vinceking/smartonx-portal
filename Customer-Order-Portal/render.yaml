# Smart On X Portal — Render Blueprint (free tier)
services:
  - type: web
    name: smartonx-portal
    runtime: node
    plan: free
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      PORT=10000 BASE_PATH=/ corepack pnpm --filter @workspace/customer-portal run build &&
      corepack pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartonx-db
          property: connectionString

databases:
  - name: smartonx-db
    plan: free
    databaseName: soxportal
    user: sox
